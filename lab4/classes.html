<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ponomar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Долголесье — что сортировать</title>
</head>
<body class="page page--cream">

<main class="sorting-codes">

    <div class="sorting-codes__row">
        <img src="img/plastic.png" alt="Коды переработки пластика" class="sorting-codes__image sorting-codes__image--plastic">
        <div class="sorting-codes__info">
            <h2 class="sorting-codes__title">Пластик</h2>
            <p class="sorting-codes__description">Бутылки, флаконы, контейнеры и другая упаковка с подходящей маркировкой</p>
        </div>
    </div>

    <div class="sorting-codes__row">
        <img src="img/paper.png" alt="Коды переработки бумаги" class="sorting-codes__image">
        <div class="sorting-codes__info">
            <h2 class="sorting-codes__title">Бумага</h2>
            <p class="sorting-codes__description">Газеты, журналы, картонные коробки и бумажная упаковка</p>
        </div>
    </div>

    <div class="sorting-codes__row">
        <img src="img/metal.png" alt="Коды переработки металла" class="sorting-codes__image">
        <div class="sorting-codes__info">
            <h2 class="sorting-codes__title">Железо</h2>
            <p class="sorting-codes__description">Консервные банки, металлические крышки и другая стальная упаковка</p>
        </div>
    </div>

    <div class="sorting-codes__row">
        <img src="img/glass.png" alt="Коды переработки стекла" class="sorting-codes__image">
        <div class="sorting-codes__info">
            <h2 class="sorting-codes__title">Стекло</h2>
            <p class="sorting-codes__description">Стеклянные бутылки, банки и другая стеклянная тара</p>
        </div>
    </div>

</main>

<nav class="navigation navigation--glass">
    <a href="index.html" class="navigation__link">На главную</a>
</nav>

</body>
</html>
